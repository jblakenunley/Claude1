# Chablis scout: runs chablis/scout.py on GitHub's servers, which can reach api.github.com and the
# OpenSSF Scorecard API. Pulls tool-quality signals for chablis/watchlist.json and commits
# scout/DATE.json and logs/scout-DATE.txt to the chablis-scout branch, where the daily lesson reads them.
# No model, no token spend. Output is public metadata about public repos only; private data and
# recon findings never come through here.
name: chablis-scout
on:
  schedule:
    - cron: "17 9 * * *"   # 2:17am MST / 3:17am MDT, ahead of the 4:53am daily lesson
  workflow_dispatch:
permissions:
  contents: write   # commit to the chablis-scout branch
concurrency:
  group: chablis-scout
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: chablis-scout
          path: out
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Pull signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D=$(TZ=America/Denver date +%F)
          mkdir -p out/scout out/logs
          L="out/logs/scout-$D.txt"
          echo "run $(date -u +%FT%TZ)" > "$L"
          python3 chablis/scout.py selftest >> "$L" 2>&1
          python3 chablis/scout.py run --watchlist chablis/watchlist.json --out "out/scout/$D.json" >> "$L" 2>&1 || echo "scout failed" >> "$L"
      - name: Commit to chablis-scout
        working-directory: out
        run: |
          git config user.name "chablis-scout"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "scout $(TZ=America/Denver date +%F)" && git push || echo "nothing new"
