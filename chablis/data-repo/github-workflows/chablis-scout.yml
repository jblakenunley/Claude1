# Chablis scout — lives in the PRIVATE repo jblakenunley/claude1-data at .github/workflows/chablis-scout.yml.
# This copy in the public repo is the versioned source; it does not run from here.
#
# Nightly, on GitHub's servers (which can reach api.github.com and the OpenSSF Scorecard API):
# checks out the public claude1 repo for the scout code and watchlist, pulls tool-quality signals,
# and commits scout/DATE.json into claude1-data. No model, no token spend. The daily lesson reads it.
name: chablis-scout
on:
  schedule:
    - cron: "17 9 * * *"   # 2:17am MST / 3:17am MDT, ahead of the daily lesson
  workflow_dispatch:
permissions:
  contents: write   # commit scout output to this private repo only
concurrency:
  group: chablis-scout
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: jblakenunley/claude1
          path: claude1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Pull signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D=$(TZ=America/Denver date +%F)
          mkdir -p scout logs
          python3 claude1/chablis/scout.py selftest > "logs/scout-$D.txt" 2>&1
          python3 claude1/chablis/scout.py run --watchlist claude1/chablis/watchlist.json --out "scout/$D.json" >> "logs/scout-$D.txt" 2>&1
      - name: Commit
        run: |
          git config user.name "chablis-scout"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scout logs
          git commit -q -m "scout $(TZ=America/Denver date +%F)" && git push || echo "nothing new"
